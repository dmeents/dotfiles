# Isolate Noctalia v5 (beta) config/state from the v4 install in ~/.config/noctalia.
# Only the v5 `noctalia` binary reads these; v4 (quickshell) ignores them.
# Effective config dir:  $NOCTALIA_CONFIG_HOME/noctalia/  -> ~/.config/noctalia-v5/noctalia/
# Effective state file:  $NOCTALIA_STATE_HOME/noctalia/settings.toml
NOCTALIA_CONFIG_HOME=${HOME}/.config/noctalia-v5
NOCTALIA_STATE_HOME=${HOME}/.local/state/noctalia-v5
