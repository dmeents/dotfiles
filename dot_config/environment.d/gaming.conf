# Gaming / GPU environment for the uwsm session.
# systemd imports environment.d into the user session; autostart.lua then pushes
# it to the activation env (`dbus-update-activation-environment --systemd --all`),
# so anything launched from Hyprland (Steam, Proton, native Vulkan) inherits these.
#
# Hardware: AMD Ryzen 9 7950X3D + Radeon RX 7900 XT (RDNA3). See CLAUDE.md.

# Load the DXVK tuning file (input latency, VSync, GPL). Without this, dxvk.conf
# in ~/.config is never read — DXVK only auto-loads a dxvk.conf in the game's CWD.
DXVK_CONFIG_FILE=${HOME}/.config/dxvk.conf

# Keep the DXVK pipeline/shader cache in one place instead of scattered per-game.
DXVK_STATE_CACHE_PATH=${HOME}/.cache/dxvk

# Force the Mesa RADV Vulkan driver (in case AMDVLK is ever installed alongside).
AMD_VULKAN_ICD=RADV

# Enable DXR ray tracing for vkd3d-proton (D3D12) titles.
VKD3D_CONFIG=dxr11,dxr

# Intentionally NOT set (obsolete/harmful on the current CachyOS + Mesa stack):
#   RADV_PERFTEST=gpl,nggc,rt   -> all default-on in modern Mesa; `sam` was never a valid token
#   DXVK_ASYNC=1                -> only the async DXVK fork reads it; mainline uses GPL and ignores it
#   WINE_CPU_TOPOLOGY=16:8      -> unreliable on modern Proton; CachyOS handles 7950X3D V-cache scheduling
