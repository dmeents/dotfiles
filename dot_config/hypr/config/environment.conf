# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Enviroment Configuration                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# default variables
envd = HYPRCURSOR_SIZE,24
envd = XCURSOR_SIZE,24
envd = QT_CURSOR_SIZE,24

# AMD gaming variables
envd = PROTON_FSR4_UPGRADE,1
envd = PROTON_FSR4_RDNA3_UPGRADE,1
envd = PROTON_XESS_UPGRADE,1

# Gaming Display variables
envd = PROTON_ENABLE_WAYLAND,1
envd = PROTON_NO_WM_DECORATION,1
envd = PROTON_ENABLE_HDR,1

# Gaming Performance variables
# envd = ENABLE_LAYER_MESA_ANTI_LAG,1  # Disabled - can cause stuttering with recent Mesa
envd = DXVK_ASYNC,1
envd = DXVK_STATE_CACHE_PATH,/home/dmeents/.cache/dxvk

# AMD GPU optimizations
envd = AMD_VULKAN_ICD,RADV
envd = RADV_PERFTEST,gpl,nggc,rt
envd = VKD3D_CONFIG,dxr11,dxr
envd = DXVK_CONFIG_FILE,/home/dmeents/.config/dxvk.conf

# CPU topology for Ryzen 9 9950X3D (16 cores, 8 per CCX)
envd = WINE_CPU_TOPOLOGY,16:8

# Additional Wayland optimizations
envd = WLR_NO_HARDWARE_CURSORS,1
envd = WLR_RENDERER_ALLOW_SOFTWARE_CURSORS,1
