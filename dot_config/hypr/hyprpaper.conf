# Preload wallpapers (so they’re loaded into memory)
preload = ~/Pictures/Wallpapers/1.jpg
preload = ~/Pictures/Wallpapers/2.jpg

# Set wallpaper per monitor
# Use `hyprctl monitors` to find monitor names
wallpaper = ,~/Pictures/Wallpapers/1.jpg   # default for all

# Options
ipc = on           # allow control via hyprctl / external scripts
splash = false     # disable splash
