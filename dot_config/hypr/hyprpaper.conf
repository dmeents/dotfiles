# Hyprpaper 0.8.0+ Configuration
# https://github.com/hyprwm/hyprpaper

# Wallpaper configuration using new block syntax
wallpaper {
    monitor =                                    # empty = apply to all monitors
    path = ~/Pictures/wallpapers/4.jpg
    fit_mode = cover                             # Options: cover, contain, fill, tile
}

# Global options
splash = false     # disable splash screen
ipc = on           # enable IPC for wallpaper control via hyprctl
