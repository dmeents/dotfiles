# Noctalia user templates (advanced theming).
#
# Requires templates.enableUserTheming = true in ~/.config/noctalia/settings.json.
# Noctalia renders every [templates.*] block below on each color-scheme change,
# expanding {{colors.*}} tokens, then runs post_hook (only when the output file
# actually changed).
#
# Managed by chezmoi: dot_config/noctalia/user-templates.toml

[templates.beeper]
# Recolor the Beeper desktop app (beeper-v4-bin) to match the Noctalia theme.
# Beeper reads this file and injects it as <style id="custom-css">.
input_path  = "~/.config/noctalia/templates/beeper.css"
output_path = "~/.config/BeeperTexts/custom.css"
# Beeper's file-watcher is non-functional in the sandboxed build, so prompt to
# reload. Apply in Beeper via the command bar (Ctrl/Cmd-K) -> "Reload custom CSS".
post_hook   = "notify-send -a Noctalia 'Beeper theme updated' 'Run \"Reload custom CSS\" (Ctrl/Cmd-K) in Beeper to apply'"
