[Service]
# Make kde-baloo.service startable on a non-Plasma session.
#
# The packaged unit (/usr/lib/systemd/user/kde-baloo.service) gates startup on:
#     ExecCondition=/usr/bin/kde-systemd-start-condition --condition \
#         "baloofilerc:Basic Settings:Indexing-Enabled:true"
# That helper binary ships with plasma-workspace, which is NOT installed here (this
# is the Hyprland-Noctalia spin, and installing a whole Plasma session to satisfy one
# condition check would be absurd). A missing ExecCondition binary is an exec failure,
# so systemd refuses to activate the unit -- permanently, no matter how often it is
# enabled. That is why baloo silently never ran on this machine and Dolphin's
# [Search] Location=Everywhere was querying a frozen 4,988-file index.
#
# An empty assignment resets the inherited list, dropping the condition entirely.
# Nothing is lost: the condition only re-reads baloofilerc's Indexing-Enabled key,
# whose absent-means-true default is already the state we want, and enabling/disabling
# indexing on this machine is done by enabling/disabling this unit.
ExecCondition=
