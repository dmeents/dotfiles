# DXVK Configuration for Gaming Performance
# Optimized for AMD Radeon RX 7900 XT + Ryzen 9 7950X3D (RDNA3).
# Loaded via DXVK_CONFIG_FILE in ~/.config/environment.d/gaming.conf.

# Reduce input latency
dxgi.maxFrameLatency = 1
d3d9.maxFrameLatency = 1

# Disable VSync (let game/compositor handle it)
dxgi.syncInterval = 0

# Async shader compilation only applies to the async DXVK fork; mainline DXVK 2.x
# uses the graphics pipeline library below and ignores this. Left off on purpose.
# dxvk.enableAsync = true

# Use the graphics pipeline library (default on modern DXVK; kept explicit).
dxvk.useGraphicsPipelineLibrary = true
