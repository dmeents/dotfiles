# DXVK Configuration for Gaming Performance
# Optimized for AMD Radeon RX 7900 XT/XTX + Ryzen 9 9950X3D

# Reduce input latency
dxgi.maxFrameLatency = 1
d3d9.maxFrameLatency = 1

# Disable VSync (let game/compositor handle it)
dxgi.syncInterval = 0

# Enable async shader compilation (reduces stuttering)
# Note: This is also set via DXVK_ASYNC=1 environment variable
dxvk.enableAsync = true

# Optimize for RDNA3 architecture
dxvk.useGraphicsPipelineLibrary = True
