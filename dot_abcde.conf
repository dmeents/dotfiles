# abcde configuration file
# https://abcde.einval.com/wiki/Configuration

# Output format
OUTPUTTYPE="flac"

# Use cdparanoia for better error correction
CDPARANOIA=cdparanoia

# Output directory
OUTPUTDIR="${HOME}/Music"

# Temp directory for WAV files during processing
WAVOUTPUTDIR="/tmp/abcde"

# Filename format: Artist/Album/TrackNum - Title
OUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM} - ${TITLEFILE}'
VAOUTPUTFORMAT='Various Artists/${ALBUMFILE}/${TRACKNUM} - ${ARTISTFILE} - ${TITLEFILE}'

# Use MusicBrainz for disc lookups
MUSICBRAINZ=y

# Eject disc when done
EJECTCD=y
